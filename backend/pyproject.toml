[project]
name = "ssdoffice-backend"
version = "0.1.0"
description = "SDD Observatory backend — FastAPI + SQLModel + Alembic"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.5",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
