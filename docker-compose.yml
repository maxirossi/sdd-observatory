services:
  postgres:
    image: postgres:16-alpine
    container_name: ssdoffice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ssdoffice}
      POSTGRES_USER: ${POSTGRES_USER:-ssdoffice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssdoffice}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssdoffice} -d ${POSTGRES_DB:-ssdoffice}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssdoffice-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ssdoffice:ssdoffice@postgres:5432/ssdoffice}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PRIVACY_MODE: ${PRIVACY_MODE:-metadata_only}
      SCAN_TARGET_HOST_PATH: ${SCAN_TARGET_HOST_PATH:-}
      INGEST_WATCH_ENABLED: ${INGEST_WATCH_ENABLED:-true}
      INGEST_WATCH_INTERVAL_SECONDS: ${INGEST_WATCH_INTERVAL_SECONDS:-60}
      INGEST_WATCH_PATH: ${INGEST_WATCH_PATH:-/workspaces/claude-logs}
      COPILOT_LOGS_PATH: ${COPILOT_LOGS_PATH:-}
      COPILOT_STORAGE_PATH: ${COPILOT_STORAGE_PATH:-/workspaces/vscode-storage}
      # Gate de auto-ejecución: el backend solo encola jobs sobre este path (lab).
      SDD_LAB_HOST_PATH: ${SDD_LAB_HOST_PATH:-}
      RUNNER_ENABLED: ${RUNNER_ENABLED:-true}
      RUNNER_LAB_ONLY: ${RUNNER_LAB_ONLY:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ${SCAN_TARGET_PATH:-./}:/workspaces/target:ro
      # Fixture sdd-template-lab montado en su path host real → el path escaneado
      # coincide con el cwd que registrarán los logs de agentes (Fase 4).
      - ${SDD_LAB_HOST_PATH:-/tmp/_sdd_lab_unset}:${SDD_LAB_HOST_PATH:-/tmp/_sdd_lab_unset}:ro
      - ${CLAUDE_LOGS_PATH:-./}:/workspaces/claude-logs:ro
      - ${VSCODE_LOGS_PATH:-./}:/workspaces/vscode-logs:ro
      - ${VSCODE_STORAGE_PATH:-./}:/workspaces/vscode-storage:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ssdoffice-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5180}:5180"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5180

volumes:
  postgres_data:
  frontend_node_modules:
